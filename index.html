        .main-logo-container img { max-width: 200px; height: auto; }

        .category-title { border-bottom: 3px solid var(--gold); padding-bottom: 5px; margin-top: 25px; font-weight: bold; text-transform: uppercase; font-size: 15px; letter-spacing: 1px; color: var(--accent); }
        
        .product-card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #f0f0f0; position: relative; }
        .product-card:hover { border-color: var(--accent); }

        .image-container { position: relative; width: 75px; height: 75px; z-index: 10; }
        .product-image { 
            width: 75px; height: 75px; object-fit: cover; border-radius: 8px; border: 1px solid #eaeaea;

        }
        .image-container:hover .product-image { 
            transform: scale(3.5); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            z-index: 9999;
            position: relative;
        }
        
        .product-info { flex: 1; min-width: 180px; }
        .product-info h4 { margin: 0; font-size: 15px; color: #2c302e; font-weight: bold; }
        
        .actions { display: flex; gap: 8px; align-items: center; }
        .qty-input { width: 45px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; font-size: 14px;}
        
        .tester-btn { background-color: var(--btn-tester); color: white; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
        .add-btn { background-color: var(--btn-main); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .totals { margin-top: 15px; background: #fafafa; padding: 12px; border-radius: 6px; border: 1px solid #eaeaea; }

        .checkout-btn:disabled { background-color: #cccccc; cursor: not-allowed; }

        .form-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        .form-input:focus { border-color: var(--accent); outline: none; }

        .section-subtitle { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 8px; display: block; text-transform: uppercase; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }

        .remove-day-btn { background: none; border: none; color: red; font-weight: bold; cursor: pointer; position: absolute; right: 5px; top: 5px; }

        @media (max-width: 768px) {

    let cart = [];
    let dayCount = 0;

    function getTimeOptions() {
        let options = '<option value="">Ώρα...</option>';
        for (let h = 8; h <= 22; h++) {
            let hourStr = h < 10 ? '0' + h : h;
            options += `<option value="${hourStr}:00">${hourStr}:00</option>`;
            if (h < 22) options += `<option value="${hourStr}:30">${hourStr}:30</option>`;
        }
        return options;
    }

    function addWorkDay() {
        dayCount++;
        const container = document.getElementById("work-days-container");
        const div = document.createElement("div");
        div.className = "work-day-row";
        div.id = `work-day-${dayCount}`;
        div.innerHTML = `
            ${dayCount > 1 ? `<button type="button" class="remove-day-btn" onclick="removeWorkDay(${dayCount})">✕</button>` : ''}
            <div class="work-day-flex">
                <input type="date" id="date-${dayCount}" class="form-input">
                <select id="start-${dayCount}" class="form-input">${getTimeOptions()}</select>
                <select id="end-${dayCount}" class="form-input">${getTimeOptions()}</select>
            </div>
        `;
        container.appendChild(div);
    }

    function removeWorkDay(id) {
        const row = document.getElementById(`work-day-${id}`);
        if (row) row.remove();
    }

    function renderProducts() {
        const container = document.getElementById("products-container");
        container.innerHTML = "";
        const grouped = inventory.reduce((acc, curr) => {
            if (!acc[curr.cat]) acc[curr.cat] = [];
            acc[curr.cat].push(curr);
            return acc;
        }, {});

        for (const [category, items] of Object.entries(grouped)) {
            container.innerHTML += `<h2 class="category-title">${category}</h2>`;
            items.forEach((item) => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="image-container">
                            <img src="${item.img}" alt="${item.name}" class="product-image" onerror="this.src='https://placehold.co/75?text=Jo.Four'">
                        </div>
                        <div class="product-info">
                            <h4>${item.name}</h4>
                        </div>
                        <div class="actions">
                            <button id="btn-tester-${item.id}" class="tester-btn" onclick="addTester('${item.name}', '${item.id}')">🎁 Tester</button>
                            <input type="number" id="qty-${item.id}" class="qty-input" value="0" min="0">
                            <button class="add-btn" onclick="addToCart('${item.name}', '${item.id}')">Προσθήκη</button>
                        </div>
                    </div>`;
            });
        }
    }

    function addToCart(name, id, isTester = false) {
        let qtyToAdd = 1;
        if (!isTester && id) {
            qtyToAdd = parseInt(document.getElementById(`qty-${id}`).value) || 0;
            if (qtyToAdd <= 0) { alert("Επιλέξτε ποσότητα!"); return; }
        }
        const itemName = isTester ? `[TESTER] ${name}` : name;
        const existing = cart.find(item => item.name === itemName);
        if (existing) { existing.qty += qtyToAdd; } else { cart.push({ name: itemName, qty: qtyToAdd, isTester }); }
        updateCart();
    }

    function addTester(name, id) { addToCart(name, id, true); }
    function removeFromCart(name) { cart = cart.filter(i => i.name !== name); updateCart(); }

    function updateCart() {
        const cartContainer = document.getElementById("cart-items");
        cartContainer.innerHTML = "";
        let totalQty = 0;
        
        if (cart.length === 0) { 
            cartContainer.innerHTML = '<p style="color:#aaa; font-style:italic;">Δεν έχουν επιλεγεί προϊόντα.</p>'; 
            document.getElementById("total-qty-display").innerText = "0 τεμ.";
            return;
        } else {
            cart.forEach(item => {
                totalQty += item.qty;
                cartContainer.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:8px; border-bottom:1px solid #f0f0f0; padding-bottom:5px;">
                        <div style="flex:2;"><b>${item.qty}x</b> ${item.name}</div>
                        <button onclick="removeFromCart('${item.name}')" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold; margin-left:10px;">✕</button>
                    </div>`;
            });
        }

        document.getElementById("total-qty-display").innerText = totalQty + " τεμ.";

        inventory.forEach(item => {
            const btn = document.getElementById(`btn-tester-${item.id}`);
            if (btn) {
                const hasT = cart.some(c => c.name === `[TESTER] ${item.name}`);
                btn.innerHTML = hasT ? "✅ Tester" : "🎁 Tester";
                btn.style.backgroundColor = hasT ? "#27ae60" : "var(--btn-tester)";
            }
        });
    }

    function sendReport() {
        if (cart.length === 0) { alert("Παρακαλώ επιλέξτε τα προϊόντα που πουλήθηκαν/χρειάζονται αναπλήρωση!"); return; }
        if (!currentUser) { alert("Σφάλμα σύνδεσης!"); return; }

        let workDaysText = "";
        const dayRows = document.querySelectorAll(".work-day-row");
        if (dayRows.length === 0) { alert("Παρακαλώ προσθέστε τουλάχιστον μία Ημέρα Εργασίας!"); return; }

        let validDays = 0;
        dayRows.forEach(row => {
            const dateVal = row.querySelector('input[type="date"]').value;
            const startVal = row.querySelector('select:nth-of-type(1)').value;
            const endVal = row.querySelector('select:nth-of-type(2)').value;

            if (dateVal && startVal && endVal) {
                const d = new Date(dateVal);
                const daysGreek = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
                const dayName = daysGreek[d.getDay()];
                const formattedDate = dateVal.split('-').reverse().join('/');
                
                workDaysText += `• ${dayName} ${formattedDate}: ${startVal} έως ${endVal}\n`;
                validDays++;
            }
        });

        if (validDays === 0) { alert("Παρακαλώ συμπληρώστε σωστά την Ημερομηνία και τις Ώρες Εργασίας!"); return; }

        const reportNumber = getNextReportNumber();
        const inputNotes = document.getElementById("order-notes").value.trim() || "Δεν υπάρχουν σημειώσεις.";

        const orderBtn = document.getElementById("submit-order-btn");
        orderBtn.disabled = true;
        orderBtn.innerText = "ΑΠΟΣΤΟΛΗ ΑΝΑΦΟΡΑΣ...";

        let cleanCartItems = "";
        let totalQtySum = 0;
        cart.forEach(item => {
            cleanCartItems += `${item.qty}x ${item.name}\n`;
            totalQtySum += item.qty;
        });

        // ΑΥΤΟΜΑΤΗ ΣΥΜΠΛΗΡΩΣΗ ΤΩΝ ΣΤΟΙΧΕΙΩΝ ΤΗΣ ΠΡΟΩΘΗΤΡΙΑΣ ΣΤΟ EMAIL
        const combinedNotes = `=======================================\n  JO. FOUR / HONDOS CENTER PROMOTERS PORTAL\n  ΑΝΑΦΟΡΑ ΠΩΛΗΤΡΙΑΣ & RESTOCK #${reportNumber}\n=======================================\n\n👤 ΣΤΟΙΧΕΙΑ ΠΡΟΩΘΗΤΡΙΑΣ:\n------------------------\nΟΝΟΜΑΤΕΠΩΝΥΜΟ : ${currentUser.name}\nΑΦΜ           : ${currentUser.afm}\nΤΗΛΕΦΩΝΟ      : ${currentUser.phone}\nEMAIL         : ${currentUser.email}\nΚΑΤΑΣΤΗΜΑ     : ${currentUser.store}\n\n📅 ΔΗΛΩΣΗ ΕΡΓΟΣΗΜΟΥ (ΗΜΕΡΕΣ & ΩΡΕΣ):\n------------------------------------\n${workDaysText}\n📝 ΠΑΡΑΤΗΡΗΣΕΙΣ STAND:\n----------------------\n${inputNotes}`;

        const multipleRecipients = `${currentUser.email}, cosmeticskaterina@gmail.com, info@jofourgreece.gr`;

        const templateParams = {
            customer_email: multipleRecipients, 
            order_notes: combinedNotes, 
            html_cart_items: cleanCartItems, 
            products_subtotal: totalQtySum + " τεμάχια",
            shipping_cost: "0 τεμ.",
            net_total: totalQtySum + " τεμάχια",
            vat_total: "-",
            "grand-total": totalQtySum + " τεμάχια"
        };

        emailjs.send(EMAILJS_CONFIG.serviceID, EMAILJS_CONFIG.templateID, templateParams)
            .then(function(response) {
                alert("Η αναφορά #" + reportNumber + " στάλθηκε με επιτυχία!");
                
                incrementReportNumber(); 
                updateReportDisplay();

                cart = [];
                document.getElementById("work-days-container").innerHTML = "";
                document.getElementById("order-notes").value = "";
                
                addWorkDay(); 
                updateCart();
                orderBtn.disabled = false;
                orderBtn.innerText = "Αποστολη Αναφορας & Παραγγελιας";
            }, function(error) {
                alert("Αποτυχία αποστολής: " + JSON.stringify(error));
                orderBtn.disabled = false;
                orderBtn.innerText = "Αποστολη Αναφορας & Παραγγελιας";
            });
    }

    // Αρχικοποίηση
    checkSavedLogin();
    updateReportDisplay();
    addWorkDay();
    renderProducts();
</script>
</body>
</html>
